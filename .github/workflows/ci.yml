name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SecureDotnetApiFoundation.sln

      - name: Build
        run: dotnet build SecureDotnetApiFoundation.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SecureDotnetApiFoundation.sln --configuration Release --no-build

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shutdown build servers
        run: dotnet build-server shutdown

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore SecureDotnetApiFoundation.sln

      - name: Build for CodeQL
        run: dotnet build SecureDotnetApiFoundation.sln --configuration Release --no-restore /p:UseSharedCompilation=false /p:BuildInParallel=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
